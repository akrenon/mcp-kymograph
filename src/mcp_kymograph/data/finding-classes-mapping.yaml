# Mapping from finding classes to entries of outside frameworks. Open data, checked by
# mcp_kymograph.finding_classes.load_mapping (docs/finding-classes.md).
#
# `ref` is a bare number or ID, never a title or text from the source. Every framework has a
# `version` (a string) and `retrieved`, the day (YYYY-MM-DD) the IDs were read from the source;
# `date` is the date of that edition, or null, and the `note` says which date it is when it is not
# the publication. Every entry is `confirmed: false`, a draft: only a maintainer who has checked
# it against the source sets `confirmed: true`, at acceptance.
frameworks:
  - id: owasp-mcp-top10
    name: "OWASP MCP Top 10"
    version: "2025"
    retrieved: "2026-11-04"
    date: null
    note: "Beta per the project roadmap. No version or publication date beyond the edition label."
